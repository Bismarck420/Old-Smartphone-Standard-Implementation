<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSSI Dashboard</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="assets/index-CS0beFyh.css">
    <style>
        @keyframes toast-in {
            0% { transform: translateY(20px) scale(0.9); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }
        @keyframes toast-out {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-10px) scale(0.95); opacity: 0; }
        }
        @keyframes progress-drain {
            0% { width: 100%; }
            100% { width: 0%; }
        }
        @keyframes fade-in-scale {
            0% { transform: scale(0.98); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-toast-in { animation: toast-in 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-toast-out { animation: toast-out 0.3s ease-in forwards; }
        .animate-fade-in-scale { animation: fade-in-scale 0.5s ease-out forwards; }
        :root { --accent: #7c5cff; --accent-bright: #45d4ff; --surface: #171c27; --surface-raised: #202837; --line: rgba(174, 193, 255, .12); }
        body { background: radial-gradient(circle at 82% -10%, rgba(124, 92, 255, .24), transparent 35rem), radial-gradient(circle at 10% 105%, rgba(69, 212, 255, .13), transparent 30rem), #0c1018 !important; }
        aside { background: rgba(14, 19, 29, .82) !important; backdrop-filter: blur(20px); }
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1.25rem; position: relative; z-index: 20; }
        .dashboard-card { position: relative; overflow: hidden; min-height: 180px; padding: 1.25rem; border: 1px solid var(--line); border-radius: 1.15rem; background: linear-gradient(145deg, rgba(33, 42, 59, .94), rgba(18, 23, 34, .94)); box-shadow: 0 18px 45px rgba(0, 0, 0, .24); transition: transform .22s ease, border-color .22s ease, box-shadow .22s ease; }
        .dashboard-card::before { content: ''; position: absolute; inset: 0 auto 0 0; width: 3px; background: linear-gradient(var(--accent-bright), var(--accent)); opacity: .9; }
        .dashboard-card--switch::before { background: linear-gradient(#fbbf24, #f97316); }
        .dashboard-card:hover { transform: translateY(-4px); border-color: rgba(124, 92, 255, .55); box-shadow: 0 24px 55px rgba(0, 0, 0, .34); }
        .dashboard-card__header { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; margin-bottom: 1rem; }
        .dashboard-card__eyebrow { display: block; margin-bottom: .32rem; color: #8492ae; font-size: .64rem; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
        .dashboard-card__title { margin: 0; color: #f3f6ff; font-size: 1.05rem; font-weight: 700; }
        .dashboard-card__empty { margin: .5rem 0 0; color: #8d9ab3; font-size: .88rem; line-height: 1.45; }
        .dashboard-device-list { display: flex; flex-direction: column; gap: .7rem; }
        .dashboard-device { border: 1px solid rgba(174, 193, 255, .08); border-radius: .85rem; padding: .8rem; background: rgba(5, 8, 14, .22); transition: background .2s ease; }
        .dashboard-device:hover { background: rgba(124, 92, 255, .08); }
        .dashboard-device__name { display: flex; align-items: center; gap: .5rem; margin-bottom: .55rem; color: #aab7ce; font-size: .66rem; font-weight: 800; letter-spacing: .075em; text-transform: uppercase; }
        .dashboard-icon { width: 1rem; height: 1rem; color: var(--accent-bright); flex: 0 0 auto; }
        .dashboard-reading__value { color: #f8fbff; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 1.65rem; font-weight: 750; letter-spacing: -.07em; }
        .dashboard-reading__value span { margin-left: .32rem; color: #8996ae; font-family: inherit; font-size: .72rem; font-weight: 600; letter-spacing: 0; }
        .dashboard-reading--state { color: #8df6c8; font-size: .85rem; font-weight: 750; }
        .dashboard-vector { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .45rem; }
        .dashboard-vector__item { padding: .42rem .3rem; border-radius: .55rem; background: rgba(124, 92, 255, .1); color: #8290aa; font-size: .58rem; font-weight: 700; text-align: center; text-transform: uppercase; }
        .dashboard-vector__item strong { display: block; margin-top: .14rem; color: #78deff; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .78rem; letter-spacing: -.04em; }
        .dashboard-switch { width: 3rem; height: 1.68rem; padding: .19rem; border: 1px solid rgba(174, 193, 255, .15); border-radius: 99px; background: #30394b; cursor: pointer; transition: background .2s ease, border-color .2s ease; }
        .dashboard-switch--on { border-color: rgba(251, 191, 36, .65); background: #bd6b1f; }
        .dashboard-switch__knob { width: 1.18rem; height: 1.18rem; border-radius: 50%; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.4); transform: translateX(0); transition: transform .2s cubic-bezier(.2,.8,.2,1); }
        .dashboard-switch--on .dashboard-switch__knob { transform: translateX(1.3rem); }
        .dashboard-empty { padding: 3.5rem 1.5rem; border: 1px dashed rgba(174, 193, 255, .2); border-radius: 1rem; color: #8895ac; text-align: center; }
        * { box-sizing: border-box; }
        button { font: inherit; }
        .app-shell { display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: 100vh; color: #edf2ff; }
        .app-sidebar { position: sticky; top: 0; height: 100vh; padding: 1.5rem 1rem; border-right: 1px solid var(--line); }
        .brand { display: flex; align-items: center; gap: .75rem; padding: .4rem .55rem 1.8rem; }
        .brand__mark { display: grid; width: 2.35rem; height: 2.35rem; place-items: center; border-radius: .75rem; background: linear-gradient(135deg, var(--accent), var(--accent-bright)); box-shadow: 0 10px 25px rgba(92, 108, 255, .35); font-weight: 900; }
        .brand strong { display: block; font-size: .95rem; letter-spacing: .02em; }
        .brand small { display: block; margin-top: .1rem; color: #75839d; font-size: .67rem; }
        .sidebar-label { padding: 0 .65rem .65rem; color: #65738d; font-size: .62rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
        .project-list { display: flex; flex-direction: column; gap: .35rem; }
        .project-nav-item { display: flex; align-items: center; gap: .7rem; width: 100%; padding: .72rem .75rem; border: 1px solid transparent; border-radius: .75rem; background: transparent; color: #91a0ba; cursor: pointer; text-align: left; transition: .18s ease; }
        .project-nav-item:hover { background: rgba(255,255,255,.035); color: #dbe4f8; }
        .project-nav-item--active { border-color: rgba(124,92,255,.22); background: linear-gradient(90deg, rgba(124,92,255,.16), rgba(69,212,255,.04)); color: #f5f7ff; }
        .project-nav-item__mark { width: .42rem; height: .42rem; border-radius: 50%; background: #45516a; }
        .project-nav-item--active .project-nav-item__mark { background: var(--accent-bright); box-shadow: 0 0 12px var(--accent-bright); }
        .app-main { min-width: 0; }
        .app-header { display: flex; min-height: 88px; align-items: center; justify-content: space-between; gap: 1rem; padding: 1.1rem 2rem; border-bottom: 1px solid var(--line); background: rgba(12,16,24,.58); backdrop-filter: blur(18px); }
        .app-header h1 { margin: 0; font-size: clamp(1.25rem, 2vw, 1.65rem); letter-spacing: -.035em; }
        .app-header p { margin: .25rem 0 0; color: #77859e; font-size: .78rem; }
        .live-state { display: flex; align-items: center; gap: .5rem; padding: .45rem .7rem; border: 1px solid rgba(66,230,164,.18); border-radius: 99px; background: rgba(66,230,164,.07); color: #7ef0bf; font-size: .7rem; font-weight: 750; }
        .live-state__dot { width: .42rem; height: .42rem; border-radius: 50%; background: currentColor; box-shadow: 0 0 10px currentColor; }
        .live-state--offline { border-color: rgba(255,107,157,.2); background: rgba(255,107,157,.08); color: #ff8fb5; }
        .dashboard-content { display: flex; flex-direction: column; gap: 1.35rem; padding: 1.6rem 2rem 2.5rem; }
        .section-heading { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: .8rem; }
        .section-heading h2 { margin: 0; font-size: .82rem; letter-spacing: .02em; }
        .section-heading span { color: #6f7d96; font-size: .68rem; }
        .timeline-panel { padding: 1.15rem; border: 1px solid var(--line); border-radius: 1.15rem; background: linear-gradient(145deg, rgba(25,32,46,.88), rgba(14,19,29,.9)); box-shadow: 0 18px 45px rgba(0,0,0,.18); }
        .timeline-panel__header { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; margin-bottom: .8rem; }
        .timeline-panel h2 { margin: 0; font-size: .92rem; }
        .timeline-panel p { margin: .25rem 0 0; color: #718099; font-size: .7rem; }
        .text-button { border: 1px solid var(--line); border-radius: .55rem; padding: .4rem .65rem; background: rgba(255,255,255,.025); color: #9ba9c0; cursor: pointer; font-size: .66rem; }
        .text-button:hover { border-color: rgba(124,92,255,.45); color: #fff; }
        .chart-stage { position: relative; min-height: 270px; }
        #timeline-chart { display: block; width: 100%; height: 270px; }
        .chart-empty { position: absolute; inset: 0; display: grid; place-items: center; color: #65738d; font-size: .75rem; pointer-events: none; }
        .chart-legend { display: flex; flex-wrap: wrap; gap: .45rem 1rem; min-height: 1.5rem; padding-top: .45rem; }
        .chart-legend__item { display: flex; align-items: center; gap: .4rem; color: #98a5bb; font-size: .63rem; }
        .chart-legend__item i { width: .45rem; height: .45rem; border-radius: 50%; box-shadow: 0 0 8px currentColor; }
        .dashboard-device__header { display: flex; align-items: center; justify-content: space-between; gap: .6rem; }
        .graph-button { display: flex; align-items: center; gap: .3rem; border: 1px solid transparent; border-radius: .5rem; padding: .3rem .42rem; background: transparent; color: #687690; cursor: pointer; font-size: .58rem; transition: .16s ease; }
        .graph-button svg { width: .85rem; height: .85rem; }
        .graph-button:hover, .graph-button--active { border-color: rgba(69,212,255,.25); background: rgba(69,212,255,.08); color: #69dbff; }
        .switch-control { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-top: 1.5rem; padding: 1rem; border: 1px solid rgba(251,191,36,.14); border-radius: .9rem; background: rgba(251,191,36,.045); }
        .switch-control__status { display: block; color: #8390a7; font-size: 1.15rem; font-weight: 850; letter-spacing: .06em; }
        .switch-control__status--on { color: #ffc45c; }
        .switch-control small { display: block; max-width: 210px; margin-top: .25rem; overflow: hidden; color: #717e95; font-size: .62rem; text-overflow: ellipsis; white-space: nowrap; }
        .dashboard-switch { position: relative; display: block; border: 1px solid rgba(174,193,255,.15); }
        .dashboard-switch__knob { display: block; }
        .dashboard-switch:disabled { opacity: .55; cursor: progress; }
        .dashboard-toast { min-width: 260px; padding: .8rem 1rem; border: 1px solid var(--line); border-radius: .75rem; background: #17202e; color: #e6edf9; box-shadow: 0 18px 40px rgba(0,0,0,.35); animation: toast-in .3s ease both; font-size: .75rem; }
        .dashboard-toast--success { border-color: rgba(66,230,164,.28); }
        .dashboard-toast--error { border-color: rgba(255,107,157,.3); }
        .dashboard-toast--out { animation: toast-out .3s ease both; }
        @media (max-width: 760px) { .app-shell { grid-template-columns: 1fr; } .app-sidebar { position: static; width: 100%; height: auto; padding: 1rem; border-right: 0; border-bottom: 1px solid var(--line); } .brand { padding-bottom: 1rem; } .project-list { flex-direction: row; overflow-x: auto; } .project-nav-item { min-width: max-content; } .app-header, .dashboard-content { padding-left: 1rem; padding-right: 1rem; } }
        @media (max-width: 480px) { .dashboard-vector { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    </style>
</head>
<body>
    <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2 pointer-events-none"></div>
    <div class="app-shell">
        <aside class="app-sidebar">
            <div class="brand"><div class="brand__mark">O</div><div><strong>OSSI</strong><small>Sensor workspace</small></div></div>
            <div class="sidebar-label">Projects</div>
            <nav id="project-list" class="project-list"></nav>
        </aside>
        <section class="app-main">
            <header class="app-header">
                <div><h1 id="project-heading">Dashboard</h1><p id="project-subtitle">Live device overview</p></div>
                <div id="live-state" class="live-state"><span class="live-state__dot"></span><span>Live</span></div>
            </header>
            <main class="dashboard-content">
                <section>
                    <div class="section-heading"><h2>Modules</h2><span id="module-count">0 modules</span></div>
                    <div id="module-grid" class="dashboard-grid"><div class="dashboard-empty">Loading workspace…</div></div>
                </section>
                <section class="timeline-panel">
                    <div class="timeline-panel__header"><div><h2>Live timeline</h2><p>Select “Graph” on one or more sensors. The last 60 seconds stay visible.</p></div><button id="clear-chart" class="text-button" type="button">Clear</button></div>
                    <div class="chart-stage"><canvas id="timeline-chart"></canvas><div id="chart-empty" class="chart-empty">Choose a sensor to start plotting</div></div>
                    <div id="chart-legend" class="chart-legend"></div>
                </section>
            </main>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
