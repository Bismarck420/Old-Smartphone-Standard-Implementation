<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSSI Dashboard</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="assets/index-CS0beFyh.css">
    <style>
        @keyframes toast-in {
            0% { transform: translateY(20px) scale(0.9); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }
        @keyframes toast-out {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-10px) scale(0.95); opacity: 0; }
        }
        @keyframes progress-drain {
            0% { width: 100%; }
            100% { width: 0%; }
        }
        @keyframes fade-in-scale {
            0% { transform: scale(0.98); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-toast-in { animation: toast-in 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-toast-out { animation: toast-out 0.3s ease-in forwards; }
        .animate-fade-in-scale { animation: fade-in-scale 0.5s ease-out forwards; }
    </style>
</head>
<body class="bg-[#0F1115] text-white overflow-y-auto">
    <!-- Notifications will be dynamically injected here -->
    <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <div id="root" class="relative z-10">
        <div class="flex min-h-screen flex-col overflow-x-hidden bg-[#0F1115] text-white md:h-screen md:flex-row md:overflow-hidden">
            <!-- Sidebar -->
            <aside class="w-full flex-shrink-0 border-b border-white/10 bg-[#171B22] p-4 md:h-full md:w-72 md:border-b-0 md:border-r md:p-6">
                <h1 class="mb-4 text-xl font-bold md:mb-8 md:text-3xl">Projects</h1>
                <div class="flex gap-2 overflow-x-auto pb-1 md:flex-col md:gap-3 md:overflow-visible">
                    <div class="h-12 min-w-40 animate-pulse rounded-lg bg-white/5 md:min-w-0"></div>
                </div>
            </aside>

            <!-- Main Content -->
            <section class="flex min-w-0 flex-1 flex-col">
                <header class="flex min-h-20 flex-wrap items-center justify-between gap-4 border-b border-white/5 px-4 py-4 md:px-8">
                    <div class="min-w-0">
                        <h2 class="truncate text-xl font-semibold md:text-2xl">Dashboard</h2>
                    </div>
                </header>

                <main class="min-h-0 flex-1 overflow-y-auto p-4 md:p-8">
                    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 md:gap-6 xl:grid-cols-3">
                        <div class="h-36 animate-pulse rounded-lg border border-white/5 bg-white/5"></div>
                    </div>
                </main>
            </section>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
