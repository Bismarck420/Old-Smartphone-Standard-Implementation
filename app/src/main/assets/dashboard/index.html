<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>OSSI Dashboard</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="assets/index-CS0beFyh.css">
    <style>
        :root {
            color-scheme: dark;
            --background: #0b0e13;
            --sidebar: #10141b;
            --surface: #151b24;
            --surface-soft: #1b222e;
            --text: #f3f5f8;
            --muted: #8b96a8;
            --accent: #70a7ff;
            --accent-soft: rgba(112, 167, 255, .12);
            --success: #75d9ad;
            --warning: #f2b35f;
        }

        * { box-sizing: border-box; }
        [hidden] { display: none !important; }
        html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
        body { background: var(--background) !important; color: var(--text); font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
        button { color: inherit; font: inherit; }

        .app-shell { display: grid; grid-template-columns: 216px minmax(0, 1fr); width: 100%; height: 100vh; height: 100dvh; overflow: hidden; }
        .app-sidebar { min-height: 0; padding: 1.2rem .8rem; overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; background: var(--sidebar); scrollbar-color: rgba(112,167,255,.35) transparent; scrollbar-width: thin; }
        .app-sidebar::-webkit-scrollbar, .project-list::-webkit-scrollbar { width: 4px; height: 4px; }
        .app-sidebar::-webkit-scrollbar-thumb, .project-list::-webkit-scrollbar-thumb { border-radius: 99px; background: rgba(112,167,255,.35); }
        .brand { display: flex; align-items: center; gap: .7rem; padding: .25rem .55rem 1.5rem; }
        .brand__mark { display: grid; width: 2rem; height: 2rem; place-items: center; border-radius: .65rem; background: var(--accent); color: #07101d; font-size: .82rem; font-weight: 900; }
        .brand strong { font-size: .9rem; letter-spacing: .04em; }
        .sidebar-label { padding: 0 .65rem .55rem; color: #667287; font-size: .58rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
        .project-list { display: flex; flex-direction: column; gap: .2rem; }
        .project-nav-item { display: flex; min-height: 44px; align-items: center; gap: .65rem; width: 100%; padding: .65rem .7rem; border: 0; border-radius: .7rem; background: transparent; color: var(--muted); cursor: pointer; touch-action: manipulation; text-align: left; transition: background .16s ease, color .16s ease; }
        .project-nav-item:hover { background: rgba(255,255,255,.035); color: var(--text); }
        .project-nav-item--active { background: var(--accent-soft); color: #dce9ff; }
        .project-nav-item__mark { width: .38rem; height: .38rem; flex: 0 0 auto; border-radius: 50%; background: #4d586a; }
        .project-nav-item--active .project-nav-item__mark { background: var(--accent); }

        .app-main { width: 100%; height: 100%; min-width: 0; min-height: 0; overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; }
        .app-header { display: flex; min-height: 72px; align-items: center; justify-content: space-between; gap: 1rem; padding: .9rem 1.5rem; }
        .app-header h1 { margin: 0; overflow: hidden; font-size: clamp(1.25rem, 2vw, 1.55rem); font-weight: 720; letter-spacing: -.035em; text-overflow: ellipsis; white-space: nowrap; }
        .live-state { display: flex; flex: 0 0 auto; align-items: center; gap: .45rem; padding: .4rem .65rem; border-radius: 99px; background: rgba(117,217,173,.09); color: var(--success); font-size: .67rem; font-weight: 750; }
        .live-state__dot { width: .38rem; height: .38rem; border-radius: 50%; background: currentColor; }
        .live-state--offline { background: rgba(244,114,135,.09); color: #ef8da1; }

        .dashboard-content { display: flex; flex-direction: column; gap: 1rem; padding: .7rem 1.5rem 2rem; }
        .section-heading { display: flex; align-items: center; justify-content: space-between; margin-bottom: .65rem; }
        .section-heading h2 { margin: 0; font-size: .78rem; font-weight: 700; }
        .section-heading span { color: #657185; font-size: .65rem; }
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: .85rem; }
        .dashboard-card { min-width: 0; min-height: 142px; padding: 1rem; border: 0; border-radius: 1rem; background: var(--surface); box-shadow: 0 8px 24px rgba(0,0,0,.12); }
        .dashboard-card__header { display: flex; align-items: flex-start; justify-content: space-between; gap: .8rem; margin-bottom: .8rem; }
        .dashboard-card__eyebrow { display: block; margin-bottom: .2rem; color: var(--accent); font-size: .56rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
        .dashboard-card--switch .dashboard-card__eyebrow { color: var(--warning); }
        .dashboard-card__title { margin: 0; color: var(--text); font-size: 1rem; font-weight: 700; }
        .dashboard-card__empty, .dashboard-empty { margin: .4rem 0 0; color: var(--muted); font-size: .78rem; }
        .dashboard-empty { grid-column: 1 / -1; padding: 2.5rem 1rem; border-radius: 1rem; background: var(--surface); text-align: center; }

        .dashboard-device-list { display: flex; flex-direction: column; }
        .dashboard-device { padding: .65rem 0; border-bottom: 1px solid rgba(255,255,255,.055); }
        .dashboard-device:last-child { padding-bottom: 0; border-bottom: 0; }
        .dashboard-device:first-child { padding-top: 0; }
        .dashboard-device__header { display: flex; align-items: center; justify-content: space-between; gap: .5rem; }
        .dashboard-device__name { display: flex; min-width: 0; align-items: center; gap: .45rem; color: var(--muted); font-size: .62rem; font-weight: 700; text-transform: uppercase; }
        .dashboard-device__name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .dashboard-icon { width: .9rem; height: .9rem; flex: 0 0 auto; color: var(--accent); }
        .dashboard-reading__value { margin-top: .35rem; color: var(--text); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 1.45rem; font-weight: 720; letter-spacing: -.055em; }
        .dashboard-reading__value span { margin-left: .3rem; color: var(--muted); font-size: .68rem; font-weight: 600; letter-spacing: 0; }
        .dashboard-vector { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .35rem; margin-top: .4rem; }
        .dashboard-vector__item { min-width: 0; padding: .38rem .25rem; border-radius: .5rem; background: var(--surface-soft); color: var(--muted); font-size: .54rem; font-weight: 700; text-align: center; text-transform: uppercase; }
        .dashboard-vector__item strong { display: block; margin-top: .12rem; overflow: hidden; color: #c9dcff; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .72rem; text-overflow: ellipsis; }
        .graph-button { display: flex; min-width: 36px; min-height: 36px; align-items: center; justify-content: center; border: 0; border-radius: .55rem; background: transparent; color: #657185; cursor: pointer; touch-action: manipulation; }
        .graph-button span { display: none; }
        .graph-button svg { width: .95rem; height: .95rem; }
        .graph-button:hover, .graph-button--active { background: var(--accent-soft); color: var(--accent); }

        .switch-control { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-top: 1.35rem; }
        .switch-control__status { color: var(--muted); font-size: .82rem; font-weight: 750; }
        .switch-control__status--on { color: var(--warning); }
        .dashboard-switch { position: relative; display: block; width: 3.1rem; height: 1.8rem; padding: .2rem; border: 0; border-radius: 99px; background: #313a48; cursor: pointer; touch-action: manipulation; transition: background .18s ease; }
        .dashboard-switch--on { background: #cc842e; }
        .dashboard-switch__knob { display: block; width: 1.4rem; height: 1.4rem; border-radius: 50%; background: white; box-shadow: 0 2px 6px rgba(0,0,0,.28); transform: translateX(0); transition: transform .2s cubic-bezier(.2,.8,.2,1); }
        .dashboard-switch--on .dashboard-switch__knob { transform: translateX(1.3rem); }
        .dashboard-switch:disabled { opacity: .5; cursor: progress; }

        .timeline-panel { padding: 1rem; border-radius: 1rem; background: var(--surface); }
        .timeline-panel__header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: .65rem; }
        .timeline-panel h2 { margin: 0; font-size: .82rem; }
        .text-button { min-height: 36px; padding: .35rem .6rem; border: 0; border-radius: .5rem; background: var(--surface-soft); color: var(--muted); cursor: pointer; font-size: .64rem; }
        .text-button:hover { color: var(--text); }
        .chart-stage { position: relative; min-height: 230px; }
        #timeline-chart { display: block; width: 100%; height: 230px; }
        .chart-empty { position: absolute; inset: 0; display: grid; place-items: center; color: #657185; font-size: .7rem; pointer-events: none; }
        .chart-legend { display: flex; flex-wrap: wrap; gap: .4rem .8rem; min-height: 1rem; padding-top: .4rem; }
        .chart-legend__item { display: flex; align-items: center; gap: .35rem; color: var(--muted); font-size: .6rem; }
        .chart-legend__item i { width: .4rem; height: .4rem; border-radius: 50%; }

        .dashboard-toast { min-width: 240px; padding: .75rem .9rem; border-radius: .7rem; background: #202733; color: var(--text); box-shadow: 0 14px 36px rgba(0,0,0,.3); animation: toast-in .25s ease both; font-size: .72rem; }
        .dashboard-toast--success { color: var(--success); }
        .dashboard-toast--error { color: #ef8da1; }
        .dashboard-toast--out { animation: toast-out .25s ease both; }
        @keyframes toast-in { from { transform: translateY(12px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes toast-out { to { transform: translateY(-8px); opacity: 0; } }

        @media (max-width: 760px) {
            .app-shell { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
            .app-sidebar { width: 100%; height: auto; max-height: 122px; padding: max(.55rem, env(safe-area-inset-top)) .7rem .55rem; overflow-y: auto; }
            .brand { padding: 0 .2rem .55rem; }
            .sidebar-label { display: none; }
            .project-list { flex-direction: row; gap: .35rem; padding-bottom: .15rem; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x proximity; }
            .project-nav-item { min-width: max-content; min-height: 40px; padding: .5rem .65rem; scroll-snap-align: start; }
            .app-header { min-height: 62px; padding: .7rem 1rem; }
            .dashboard-content { padding: .55rem 1rem calc(1.4rem + env(safe-area-inset-bottom)); }
            .dashboard-grid { grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: .7rem; }
            .dashboard-card { min-height: 0; padding: .9rem; }
            .chart-stage { min-height: 200px; }
            #timeline-chart { height: 200px; }
            .dashboard-toast { min-width: 0; max-width: calc(100vw - 2rem); }
        }
        @media (max-width: 480px) {
            .dashboard-grid { grid-template-columns: 1fr; }
            .dashboard-vector { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }
        @media (hover: none), (pointer: coarse) {
            .graph-button, .text-button, .dashboard-switch { min-height: 42px; }
        }
    </style>
</head>
<body>
    <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2 pointer-events-none"></div>
    <div class="app-shell">
        <aside class="app-sidebar">
            <div class="brand"><div class="brand__mark">O</div><strong>OSSI</strong></div>
            <div class="sidebar-label">Projects</div>
            <nav id="project-list" class="project-list"></nav>
        </aside>
        <section class="app-main">
            <header class="app-header">
                <h1 id="project-heading">Dashboard</h1>
                <div id="live-state" class="live-state"><span class="live-state__dot"></span><span>Live</span></div>
            </header>
            <main class="dashboard-content">
                <section>
                    <div class="section-heading"><h2>Modules</h2><span id="module-count">0 modules</span></div>
                    <div id="module-grid" class="dashboard-grid"><div class="dashboard-empty">Loading workspace…</div></div>
                </section>
                <section id="timeline-panel" class="timeline-panel" hidden>
                    <div class="timeline-panel__header"><h2>Timeline</h2><button id="clear-chart" class="text-button" type="button">Clear</button></div>
                    <div class="chart-stage"><canvas id="timeline-chart"></canvas><div id="chart-empty" class="chart-empty">Waiting for readings</div></div>
                    <div id="chart-legend" class="chart-legend"></div>
                </section>
            </main>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
